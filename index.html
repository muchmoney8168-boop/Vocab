<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>單字記憶卡片 (Vocab App)</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background-color: #0f0f11; /* 非常深的深灰色背景，符合截圖風格 */
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }

        /* 3D 翻轉卡片必備的自定義 CSS */
        .perspective-1000 {
            perspective: 1000px;
        }
        
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden; /* Safari 支援 */
        }
        
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* 隱藏原生檔案上傳按鈕 */
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function FlashcardApp() {
            // 狀態管理
            const [words, setWords] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [stats, setStats] = useState({ familiar: 0, needReview: 0 });
            const [isLoading, setIsLoading] = useState(true);
            const [currentGroup, setCurrentGroup] = useState("Group 84"); // 預設群組名

            // 處理檔案上傳的 ref
            const fileInputRef = useRef(null);

            useEffect(() => {
                // 嘗試自動載入同目錄下的 文字.json (對應 GitHub Pages 的設定)
                fetch('./文字.json')
                    .then(res => {
                        if (!res.ok) throw new Error("找不到檔案");
                        return res.json();
                    })
                    .then(data => {
                        if (Array.isArray(data) && data.length > 0) {
                            setWords(data);
                            // 嘗試從第一筆資料中提取群組名稱
                            if (data[0].group) setCurrentGroup(data[0].group);
                        } else {
                            loadMockData(); // 如果檔案是空的，載入預設資料
                        }
                    })
                    .catch(err => {
                        console.warn("無法自動載入 文字.json，使用預設單字庫:", err);
                        loadMockData();
                    })
                    .finally(() => {
                        setIsLoading(false);
                    });
            }, []);

            const loadMockData = () => {
                setWords([
                    { id: 4162, word: "sow", part_of_speech: "v.", meaning: "播種；散佈", group: "Group 84" },
                    { id: 4163, word: "reap", part_of_speech: "v.", meaning: "收割；獲得", group: "Group 84" },
                    { id: 4164, word: "cultivate", part_of_speech: "v.", meaning: "耕作；培養", group: "Group 84" }
                ]);
            };

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const json = JSON.parse(e.target.result);
                        if (Array.isArray(json) && json.length > 0) {
                            setWords(json);
                            setCurrentIndex(0);
                            setIsFlipped(false);
                            setStats({ familiar: 0, needReview: 0 });
                            if (json[0].group) setCurrentGroup(json[0].group);
                        } else {
                            alert("JSON 格式不正確或為空！請確保是一個包含單字物件的陣列。");
                        }
                    } catch (err) {
                        alert("解析 JSON 失敗，請確認檔案格式是否正確。");
                    }
                };
                reader.readAsText(file);
                // 重置 input，允許重複上傳同一個檔案
                event.target.value = '';
            };

            const handleNext = () => {
                if (currentIndex < words.length - 1) {
                    setIsFlipped(false);
                    // 使用 setTimeout 確保翻轉動畫重置後再切換內容
                    setTimeout(() => setCurrentIndex(prev => prev + 1), 150);
                }
            };

            const handlePrev = () => {
                if (currentIndex > 0) {
                    setIsFlipped(false);
                    setTimeout(() => setCurrentIndex(prev => prev - 1), 150);
                }
            };

            const toggleFlip = () => {
                setIsFlipped(!isFlipped);
            };

            const resetApp = () => {
                setCurrentIndex(0);
                setIsFlipped(false);
                setStats({ familiar: 0, needReview: 0 });
            };

            if (isLoading) {
                return <div className="min-h-screen flex items-center justify-center text-white">載入中...</div>;
            }

            if (words.length === 0) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center text-white p-4">
                        <p className="mb-4">沒有找到單字資料</p>
                        <button onClick={() => fileInputRef.current.click()} className="px-4 py-2 bg-gray-800 rounded-lg border border-gray-600">
                            上傳 JSON 檔案
                        </button>
                        <input type="file" accept=".json" ref={fileInputRef} onChange={handleFileUpload} />
                    </div>
                );
            }

            const currentWord = words[currentIndex];
            const progressPercentage = ((currentIndex + 1) / words.length) * 100;

            return (
                <div className="min-h-screen flex flex-col max-w-md mx-auto p-4 sm:p-6 pb-8">
                    
                    {/* Header */}
                    <div className="flex items-center justify-between mb-6">
                        <div className="flex items-center gap-3">
                            <span className="bg-indigo-900/50 text-indigo-300 px-3 py-1 rounded-full text-xs font-semibold border border-indigo-800/50">
                                {currentGroup}
                            </span>
                            <h1 className="text-white font-bold text-lg">單字記憶卡片</h1>
                        </div>
                        <div className="flex gap-2">
                            <button 
                                onClick={() => fileInputRef.current.click()} 
                                className="px-3 py-1.5 bg-[#1a1a1c] border border-gray-700 rounded-full text-xs text-gray-300 flex items-center gap-1 active:bg-gray-800 transition-colors"
                            >
                                ↑ JSON
                            </button>
                            <input type="file" accept=".json" ref={fileInputRef} onChange={handleFileUpload} />
                            
                            <button 
                                onClick={resetApp}
                                className="px-3 py-1.5 bg-[#1a1a1c] border border-gray-700 rounded-full text-xs text-gray-300 flex items-center gap-1 active:bg-gray-800 transition-colors"
                            >
                                ↺ 重置
                            </button>
                        </div>
                    </div>

                    {}
                    <div className="bg-[#1c1c1e] rounded-2xl p-4 mb-6 border border-[#2c2c2e]">
                        {/* Progress Bar */}
                        <div className="h-1.5 w-full bg-gray-800 rounded-full mb-3 overflow-hidden">
                            <div 
                                className="h-full bg-indigo-500 transition-all duration-300 ease-out" 
                                style={{ width: `${progressPercentage}%` }}
                            ></div>
                        </div>
                        
                        <div className="flex justify-between items-center text-xs text-gray-400">
                            <span>無盡模式 (第 {currentIndex + 1} 張)</span>
                            <span>熟練: {stats.familiar} | 待加強: {stats.needReview}</span>
                        </div>
                    </div>

                    {}
                    {/* CRITICAL FIX: 給予外層容器明確的 min-height (如 h-80/min-h-[320px])，防止絕對定位的子元素導致高度塌陷 */}
                    <div 
                        className="relative w-full h-80 sm:h-96 perspective-1000 cursor-pointer mb-8 group"
                        onClick={toggleFlip}
                    >
                        <div className={`w-full h-full duration-500 transform-style-3d relative transition-transform ${isFlipped ? 'rotate-y-180' : ''}`}>
                            
                            {/* Card Front */}
                            <div className="absolute inset-0 w-full h-full backface-hidden bg-[#1c1c1e] rounded-2xl p-6 border border-[#2c2c2e] shadow-lg flex flex-col justify-center">
                                <div className="absolute top-4 right-5 text-gray-500 text-sm font-mono">
                                    ID: {currentWord.id || "N/A"}
                                </div>
                                
                                <div className="flex flex-col items-center justify-center text-center mt-4">
                                    <h2 className="text-5xl font-bold text-white tracking-wide mb-3">{currentWord.word}</h2>
                                    {currentWord.part_of_speech && (
                                        <span className="text-indigo-400 text-lg italic">{currentWord.part_of_speech}</span>
                                    )}
                                </div>
                                
                                <div className="absolute bottom-4 left-0 w-full text-center text-gray-500 text-xs">
                                    點擊翻轉查看解釋
                                </div>
                            </div>

                            {/* Card Back */}
                            <div className="absolute inset-0 w-full h-full backface-hidden bg-[#242427] rounded-2xl p-6 border border-indigo-900/30 shadow-lg flex flex-col justify-center rotate-y-180">
                                <div className="flex flex-col items-center justify-center text-center">
                                    <h3 className="text-3xl text-white font-medium mb-4 leading-relaxed">
                                        {currentWord.meaning}
                                    </h3>
                                    
                                    {/* 提供自我評估的按鈕，點擊時不觸發卡片翻轉 (e.stopPropagation) */}
                                    <div className="flex gap-4 mt-6">
                                        <button 
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                setStats(s => ({...s, needReview: s.needReview + 1}));
                                                handleNext();
                                            }}
                                            className="px-5 py-2 rounded-xl bg-red-900/30 text-red-400 border border-red-900/50 hover:bg-red-900/50 transition-colors"
                                        >
                                            待加強
                                        </button>
                                        <button 
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                setStats(s => ({...s, familiar: s.familiar + 1}));
                                                handleNext();
                                            }}
                                            className="px-5 py-2 rounded-xl bg-green-900/30 text-green-400 border border-green-900/50 hover:bg-green-900/50 transition-colors"
                                        >
                                            熟練
                                        </button>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                    {}
                    {/* Controls */}
                    <div className="flex justify-between items-center gap-3 mb-6">
                        <button 
                            onClick={handlePrev}
                            disabled={currentIndex === 0}
                            className={`flex-1 py-3.5 rounded-2xl border border-[#2c2c2e] text-sm font-medium transition-colors ${currentIndex === 0 ? 'bg-[#121212] text-gray-600' : 'bg-[#1c1c1e] text-gray-300 active:bg-gray-800'}`}
                        >
                            ← 上一個
                        </button>
                        
                        <button 
                            onClick={toggleFlip}
                            className="flex-1 py-3.5 rounded-2xl border border-[#2c2c2e] bg-[#2c2c30] text-sm font-medium text-white active:bg-gray-700 transition-colors"
                        >
                            翻轉卡片 ↻
                        </button>
                        
                        <button 
                            onClick={handleNext}
                            disabled={currentIndex === words.length - 1}
                            className={`flex-1 py-3.5 rounded-2xl border border-[#2c2c2e] text-sm font-medium transition-colors ${currentIndex === words.length - 1 ? 'bg-[#121212] text-gray-600' : 'bg-[#1c1c1e] text-gray-300 active:bg-gray-800'}`}
                        >
                            下一個 →
                        </button>
                    </div>

                    {/* Exit Button */}
                    <button className="w-full py-4 rounded-2xl border border-[#2c2c2e] bg-[#121212] text-gray-400 text-sm font-medium hover:text-white hover:bg-[#1c1c1e] transition-colors mt-auto">
                        退出學習
                    </button>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FlashcardApp />);
    </script>
</body>
</html>

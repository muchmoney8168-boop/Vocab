<script type="text/babel">  
const{useState,useEffect,useRef}=React;  
  
const DEFAULT_WORDS=[  
{id:4151,en:"sore",pos:"adj.",zh:"疼痛的",ex:"Poor girl! It must be extreme sore. Be brave!<br>可憐的女孩，一定很痛吧。勇敢一點喔。",root:"古英語 sār（受傷痛楚）",mem:"諧音「瘦兒」：太過瘦弱的孩子跌倒容易感到疼痛。",group:"Group 84"},  
{id:4152,en:"sorrow",pos:"n./v.",zh:"悲傷",ex:"I don't know how to throw away my sorrow; maybe I just keep thinking too much.<br>我不知道如何拋棄我的煩惱，或許我只是想太多。",root:"原始日耳曼語 sorgō（憂慮受創）",mem:"sor (sore 痛) + row (划船)：獨自在寒風中划船，心中充滿悲傷。",group:"Group 84"},  
{id:4153,en:"sorrowful",pos:"adj.",zh:"悲傷的",ex:"Nobody can understand my sorrowful feeling.<br>沒人能了解我的悲傷的心情。",root:"sorrow (悲傷) + -ful (充滿…的)",mem:"心中充滿了 sorrow（悲傷），神情自然很悲傷的。",group:"Group 84"}  
];  
  
const LEARNING_STORAGE_KEY="vocab_learning_records_v1";
const DAILY_ACTIVITY_KEY="vocab_daily_activity_v1";
const localDayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const loadDailyActivity=()=>{try{return JSON.parse(localStorage.getItem(DAILY_ACTIVITY_KEY)||'{}')||{};}catch{return {};}};
const BOOKS_STORAGE_KEY="vocab_bookshelf_v1";
const BUILTIN_BOOK_ID="core4500";
const BUILTIN_BOOK={id:BUILTIN_BOOK_ID,title:"核心 4500 單字",subtitle:"",icon:"A–Z",color:"from-indigo-600 to-blue-800",builtin:true,createdAt:0};
const ALLPLUS_BOOK={id:"allplus",title:"All+ 雜誌",subtitle:"",icon:"ALL+",color:"from-amber-500 to-orange-700",builtin:true,managed:true,words:[],createdAt:0};
const loadBooks=()=>{try{const raw=JSON.parse(localStorage.getItem(BOOKS_STORAGE_KEY)||"[]");const saved=Array.isArray(raw)?raw.filter(b=>b&&b.id!==BUILTIN_BOOK_ID&&b.id!==ALLPLUS_BOOK.id):[];return [BUILTIN_BOOK,ALLPLUS_BOOK,...saved];}catch(e){return [BUILTIN_BOOK,ALLPLUS_BOOK];}};
const saveBooks=books=>{try{localStorage.setItem(BOOKS_STORAGE_KEY,JSON.stringify(books.filter(b=>b.id!==BUILTIN_BOOK_ID&&b.id!==ALLPLUS_BOOK.id)));}catch(e){console.error("儲存書櫃失敗",e);}};
const EMPTY_LEARNING_RECORD={red:0,yellow:0,green:0,blue:0,mastery:null,masteryScore:null,history:[],yellowStar:false,blueStar:false,lastReviewedAt:null};
const MASTERY_BASE_SCORE={red:10,yellow:35,green:62,blue:88};
const clampScore=value=>Math.max(0,Math.min(100,Math.round(value)));
// 升級門檻高於降級門檻，避免分數在邊界附近反覆跳級。
const resolveMastery=(score,current)=>{
  const up={red:32,yellow:60,green:87,blue:101};
  const down={red:-1,yellow:18,green:46,blue:73};
  let level=current||'red';
  const order=['red','yellow','green','blue'];
  while(order.indexOf(level)<3&&score>=up[level])level=order[order.indexOf(level)+1];
  while(order.indexOf(level)>0&&score<down[level])level=order[order.indexOf(level)-1];
  return level;
};
const shuffleArray=items=>{const result=[...items];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}return result;};
const loadLearningRecords=()=>{try{const raw=localStorage.getItem(LEARNING_STORAGE_KEY);const records=raw?JSON.parse(raw)||{}:{};let migrated=false;Object.keys(records).forEach(key=>{if(!key.includes("::")){records[`${BUILTIN_BOOK_ID}::${key}`]=records[key];delete records[key];migrated=true;}});if(migrated)localStorage.setItem(LEARNING_STORAGE_KEY,JSON.stringify(records));return records;}catch(e){console.error("讀取學習紀錄失敗：",e);return{};}};
const saveLearningRecords=records=>{try{localStorage.setItem(LEARNING_STORAGE_KEY,JSON.stringify(records));}catch(e){console.error("儲存學習紀錄失敗：",e);}};
const normalizeLearningRecord=record=>({...EMPTY_LEARNING_RECORD,...(record||{})});
const buildLearningState=records=>{const starred={},mastery={},lastReviewedAt={},stats={red:0,yellow:0,green:0,blue:0};Object.entries(records).forEach(([id,raw])=>{const r=normalizeLearningRecord(raw);if(r.yellowStar||r.blueStar)starred[id]={yellow:!!r.yellowStar,blue:!!r.blueStar};if(r.mastery)mastery[id]=r.mastery;if(r.lastReviewedAt)lastReviewedAt[id]=r.lastReviewedAt;stats.red+=Number(r.red)||0;stats.yellow+=Number(r.yellow)||0;stats.green+=Number(r.green)||0;stats.blue+=Number(r.blue)||0;});return{starred,mastery,lastReviewedAt,stats};};
// 以歷史掌握度、近期錯誤、複習間隔及短期冷卻共同計算下一張卡的權重。
const getCardPriority=(word,records,now=Date.now())=>{
  const key=`${word.__bookId||BUILTIN_BOOK_ID}::${String(word.id)}`;
  const record=normalizeLearningRecord(records[key]);
  const history=Array.isArray(record.history)?record.history:[];
  const score=record.masteryScore!==null&&record.masteryScore!==undefined&&Number.isFinite(Number(record.masteryScore))?Number(record.masteryScore):MASTERY_BASE_SCORE[record.mastery]||20;
  let priority=1.2+(100-score)/18;
  const recent=history.slice(-5);
  const recentRed=recent.filter(e=>e.rating==='red').length;
  const recentYellow=recent.filter(e=>e.rating==='yellow').length;
  priority+=recentRed*1.7+recentYellow*.65;
  const last=Number(record.lastReviewedAt)||0;
  if(last){const days=Math.max(0,(now-last)/86400000);priority+=Math.min(3,Math.log2(days+1)*.8);}
  else priority+=1.5;
  return Math.max(.2,Math.min(18,priority));
};
const chooseWeightedWord=(pool,records,recentKeys=[])=>{
  if(!pool.length)return null;
  const recent=new Set(recentKeys.slice(-Math.min(8,Math.max(0,pool.length-1))));
  let candidates=pool.filter(w=>!recent.has(`${w.__bookId||BUILTIN_BOOK_ID}::${String(w.id)}`));
  if(!candidates.length)candidates=pool.filter(w=>!recentKeys.length||`${w.__bookId||BUILTIN_BOOK_ID}::${String(w.id)}`!==recentKeys[recentKeys.length-1]);
  if(!candidates.length)candidates=pool;
  const weights=candidates.map(w=>getCardPriority(w,records));
  const total=weights.reduce((a,b)=>a+b,0);let pick=Math.random()*total;
  for(let i=0;i<candidates.length;i++){pick-=weights[i];if(pick<=0)return candidates[i];}
  return candidates[candidates.length-1];
};

function FlashcardApp(){  
const initialLearningRef=useRef(null);
if(!initialLearningRef.current)initialLearningRef.current=buildLearningState(loadLearningRecords());
const initialLearning=initialLearningRef.current;
const[words,setWords]=useState([]),[currentIndex,setCurrentIndex]=useState(0),[isFlipped,setIsFlipped]=useState(false);
const[stats,setStats]=useState(initialLearning.stats),[starredWords,setStarredWords]=useState(initialLearning.starred);
const[cardMastery,setCardMastery]=useState(initialLearning.mastery),[lastReviewedAt,setLastReviewedAt]=useState(initialLearning.lastReviewedAt);  
const[isLoading,setIsLoading]=useState(true),[notice,setNotice]=useState(null),[showHelpModal,setShowHelpModal]=useState(false);  
  
const groupCacheRef=useRef({});  
const groupLoadingRef=useRef({});  
const bankLoadRequestRef=useRef(0);  
const reviewStartRequestRef=useRef(0);  
const fileInputRef=useRef(null);
const progressBackupInputRef=useRef(null);  
  
const[mainMode,setMainMode]=useState('home');
const[dailyActivity,setDailyActivity]=useState(()=>loadDailyActivity());
const[books,setBooks]=useState(()=>loadBooks());
const[activeBookId,setActiveBookId]=useState(BUILTIN_BOOK_ID);
const[bookManagerId,setBookManagerId]=useState(null);
const activeBook=books.find(b=>b.id===activeBookId)||BUILTIN_BOOK;
const learningKey=(id,bookId=activeBookId)=>`${bookId}::${String(id)}`;
const bookGroups=activeBook.id===BUILTIN_BOOK_ID?Array.from({length:90},(_,i)=>`Group ${i+1}`):[...new Set((activeBook.words||words).map(w=>w.group||'Group 1'))];  
const[selectedBankGroup,setSelectedBankGroup]=useState('ALL');  
const[showGroupPicker,setShowGroupPicker]=useState(false);  
const[groupInput,setGroupInput]=useState('1');  
const[recentGroups,setRecentGroups]=useState([]);  
const[bankStarFilter,setBankStarFilter]=useState({yellow:false,blue:false});  
const[selectedReviewGroups,setSelectedReviewGroups]=useState(['Group 1']);
const[crossBookQuiz,setCrossBookQuiz]=useState(false);
const[selectedReviewBookIds,setSelectedReviewBookIds]=useState([BUILTIN_BOOK_ID,'allplus']);  
const[isInfiniteCount,setIsInfiniteCount]=useState(false);  
const[reviewCountInput,setReviewCountInput]=useState(10);  
const[reviewModeType,setReviewModeType]=useState('single');  
const[useDaysFilter,setUseDaysFilter]=useState(false);  
const[reviewDaysInput,setReviewDaysInput]=useState(7);  
const[reviewMasteries,setReviewMasteries]=useState({red:false,yellow:false,green:false,blue:false});  
const[reviewStars,setReviewStars]=useState({yellow:false,blue:false});  
const[reviewQueue,setReviewQueue]=useState([]);  
const[reviewIndex,setReviewIndex]=useState(0);  
const[reviewCompletedCount,setReviewCompletedCount]=useState(0);
const recentReviewKeysRef=useRef([]);
const reviewPoolRef=useRef([]);  
  
// 每個單字的 JSON 物件可直接加入 synonyms 欄位，例如 synonyms:["give up","desert"]；中文面會自動顯示。
const parseHtmlToWords=htmlText=>{  
try{  
const parser=new DOMParser(),doc=parser.parseFromString(htmlText,"text/html"),jsonScript=doc.getElementById("vocab-data");  
if(jsonScript){  
const parsed=JSON.parse(jsonScript.textContent);  
if(Array.isArray(parsed)&&parsed.length)return parsed.map(item=>({...item,group:item.group||"Group 84"}));  
}  
const items=doc.querySelectorAll(".word-item,[data-en],[data-word]");  
if(items.length){  
const parsed=[];  
items.forEach((el,index)=>parsed.push({  
id:el.dataset.id||(index+1),  
en:el.dataset.en||el.dataset.word||el.querySelector('.word,.en')?.textContent?.trim()||'',  
pos:el.dataset.pos||el.querySelector('.pos')?.textContent?.trim()||'',  
zh:el.dataset.zh||el.dataset.meaning||el.querySelector('.meaning,.zh')?.textContent?.trim()||'',  
ex:el.dataset.ex||el.querySelector('.ex')?.innerHTML?.trim()||'',  
root:el.dataset.root||el.querySelector('.root')?.textContent?.trim()||'',  
mem:el.dataset.mem||el.querySelector('.mem')?.textContent?.trim()||'',  
group:el.dataset.group||"Group 84"  
}));  
return parsed.filter(w=>w.en);  
}  
}catch(e){console.error("解析 HTML 單字檔失敗:",e)}  
return null;  
};  
  
useEffect(()=>{setIsLoading(false);},[]);
// All+ 採用動態組別清單：新增組別時只需新增 JSON，並更新 groups.json，不必改主程式。
useEffect(()=>{
  let cancelled=false;
  const loadAllPlus=async()=>{
    try{
      const manifestResponse=await fetch('./allplus/groups.json',{cache:'no-store'});
      if(!manifestResponse.ok)throw new Error('找不到 allplus/groups.json');
      const manifest=await manifestResponse.json();
      const groupEntries=Array.isArray(manifest)?manifest:(Array.isArray(manifest.groups)?manifest.groups:[]);
      const results=await Promise.all(groupEntries.map(async(entry,index)=>{
        const file=typeof entry==='string'?entry:entry.file;
        const groupName=typeof entry==='string'?entry.replace(/\.json$/i,''):(entry.name||entry.group||entry.file?.replace(/\.json$/i,'')||`All+ ${String(index+1).padStart(2,'0')}`);
        if(!file)return [];
        const response=await fetch(`./allplus/${file}`,{cache:'no-store'});
        if(!response.ok)throw new Error(`找不到 allplus/${file}`);
        const data=await response.json();
        if(!Array.isArray(data))throw new Error(`${file} 必須是 JSON 陣列`);
        return data.map((word,wordIndex)=>({...word,id:word.id??`${groupName}-${wordIndex+1}`,group:word.group||groupName}));
      }));
      const normalized=results.flat();
      if(cancelled)return;
      setBooks(prev=>prev.map(book=>book.id==='allplus'?{...book,words:normalized}:book));
      setWords(current=>activeBookId==='allplus'?normalized:current);
    }catch(error){
      console.error('載入 All+ 題庫失敗：',error);
      if(!cancelled)setNotice(`All+ 題庫載入失敗：${error.message}`);
    }
  };
  loadAllPlus();
  return()=>{cancelled=true;};
},[activeBookId]);  
  
const availableGroups=Array.from({length:90},(_,i)=>`Group ${i+1}`);  
  
const fetchGroupData=async groupNumber=>{  
if(groupCacheRef.current[groupNumber])return groupCacheRef.current[groupNumber];  
if(groupLoadingRef.current[groupNumber])return groupLoadingRef.current[groupNumber];  
  
const fileName=`group${String(groupNumber).padStart(2,'0')}.json`;  
const promise=(async()=>{  
const response=await fetch(`./words/${fileName}`,{cache:"no-store"});  
if(!response.ok)throw new Error(`找不到 ${fileName}`);  
const data=await response.json();  
if(!Array.isArray(data))throw new Error(`${fileName} 格式錯誤`);  
const normalizedData=data.map(item=>({...item,group:item.group||`Group ${groupNumber}`}));  
groupCacheRef.current[groupNumber]=normalizedData;  
return normalizedData;  
})();  
groupLoadingRef.current[groupNumber]=promise;  
try{return await promise}finally{delete groupLoadingRef.current[groupNumber]}  
};  
  
const loadGroup=async groupNumber=>{  
const requestId=++bankLoadRequestRef.current;  
setIsLoading(true);  
try{  
const data=await fetchGroupData(groupNumber);  
if(requestId!==bankLoadRequestRef.current)return;  
setWords(data);setCurrentIndex(0);setIsFlipped(false);  
setNotice(`已載入第 ${groupNumber} 組，共 ${data.length} 個單字`);  
}catch(error){  
if(requestId!==bankLoadRequestRef.current)return;  
setNotice(`❌ 載入第 ${groupNumber} 組失敗：${error.message}`);  
}finally{  
if(requestId===bankLoadRequestRef.current)setIsLoading(false);  
}  
};  

const loadAndSelectGroup=async groupNumber=>{
  const n=Math.max(1,Math.min(90,Number(groupNumber)||1));
  const group=`Group ${n}`;
  setSelectedBankGroup(group);
  setCurrentIndex(0);
  setIsFlipped(false);
  setRecentGroups(prev=>[n,...prev.filter(x=>x!==n)].slice(0,4));
  if(activeBook.id!==BUILTIN_BOOK_ID){
    const target=(activeBook.words||[]).filter(w=>(w.group||'Group 1')===group);
    setWords(target);
    setNotice(`已切換至第 ${n} 組，共 ${target.length} 個單字`);
    return;
  }
  await loadGroup(n);
};

const loadAllGroups=async()=>{
const results=await Promise.allSettled(Array.from({length:90},(_,i)=>fetchGroupData(i+1)));
const merged=[];
results.forEach(result=>{if(result.status==='fulfilled')merged.push(...result.value);});
merged.sort((a,b)=>Number(a.id||0)-Number(b.id||0));
return merged;
};

const loadGroups=async groupNumbers=>{  
const uniqueGroups=[...new Set(groupNumbers)];  
try{  
setIsLoading(true);  
console.log("準備載入複習組別：",uniqueGroups);  
const results=await Promise.all(uniqueGroups.map(async groupNumber=>{  
const data=await fetchGroupData(groupNumber);  
console.log(`Group ${groupNumber} 成功載入 ${data.length} 字`);  
return data;  
}));  
const mergedWords=results.flat();  
console.log(`複習題庫共載入 ${mergedWords.length} 個單字`);  
return mergedWords;  
}catch(e){  
console.error("載入複習題庫失敗：",e);  
setNotice(`❌ 載入複習題庫失敗：${e.message}`);  
return null;  
}finally{setIsLoading(false)}  
};  
  
const bankFilteredWords=words.filter(word=>{  
const grp=word.group||"Group 84";  
if(selectedBankGroup!=='ALL'&&grp!==selectedBankGroup)return false;  
const star=starredWords[learningKey(word.id)]||{yellow:false,blue:false};  
if(bankStarFilter.yellow&&!star.yellow)return false;  
if(bankStarFilter.blue&&!star.blue)return false;  
return true;  
});  
  
const rememberCurrentReviewCard=()=>{
  const word=reviewQueue[reviewIndex];if(!word)return;
  const key=learningKey(word.id,word.__bookId||activeBookId);
  recentReviewKeysRef.current=[...recentReviewKeysRef.current,key].slice(-12);
};
const advanceReview=()=>{
  if(reviewIndex<reviewQueue.length-1){
    rememberCurrentReviewCard();setIsFlipped(false);setTimeout(()=>setReviewIndex(prev=>prev+1),120);return;
  }
  if(reviewModeType==='single')return;
  rememberCurrentReviewCard();
  const pool=reviewPoolRef.current;
  const next=chooseWeightedWord(pool,loadLearningRecords(),recentReviewKeysRef.current);
  if(!next){setNotice('目前沒有可繼續複習的單字。');return;}
  const key=learningKey(next.id,next.__bookId||activeBookId);
  recentReviewKeysRef.current=[...recentReviewKeysRef.current,key].slice(-12);
  setReviewQueue(prev=>[...prev,next]);setIsFlipped(false);setTimeout(()=>setReviewIndex(prev=>prev+1),120);
};
const handleNext=()=>{
  if(mainMode==='bank'){
    if(currentIndex<bankFilteredWords.length-1){setIsFlipped(false);setTimeout(()=>setCurrentIndex(prev=>prev+1),120);}
  }else if(mainMode==='review_active')advanceReview();
};

const handlePrev=()=>{  
if(mainMode==='bank'){  
if(currentIndex>0){setIsFlipped(false);setTimeout(()=>setCurrentIndex(prev=>prev-1),120)}  
}else if(mainMode==='review_active'&&reviewIndex>0){  
setIsFlipped(false);setTimeout(()=>setReviewIndex(prev=>prev-1),120);  
}  
};  
  
const toggleFlip=()=>setIsFlipped(prev=>{
  const next=!prev;
  if(next){const day=localDayKey();setDailyActivity(old=>{const updated={...old,[day]:(Number(old[day])||0)+1};try{localStorage.setItem(DAILY_ACTIVITY_KEY,JSON.stringify(updated));}catch(e){}return updated;});}
  return next;
});  
  
const toggleStar=(wordId,color,bookId=activeBookId)=>{
if(wordId===undefined||wordId===null)return;
setStarredWords(prev=>{
const key=learningKey(wordId,bookId);
const current=prev[key]||{yellow:false,blue:false},next={...current,[color]:!current[color]};
const records=loadLearningRecords();
records[key]={...normalizeLearningRecord(records[key]),yellowStar:!!next.yellow,blueStar:!!next.blue};
saveLearningRecords(records);
return{...prev,[key]:next};
});
};  
  
const speakWord=text=>{  
if('speechSynthesis'in window){  
window.speechSynthesis.cancel();  
const utterance=new SpeechSynthesisUtterance(text);  
utterance.lang='en-US';utterance.rate=.9;  
window.speechSynthesis.speak(utterance);  
}  
};  

// 翻到中文面時自動播放英文發音；延遲少許，避免翻卡動畫期間被打斷。
useEffect(()=>{
  if(!isFlipped || !(currentWord?.en||currentWord?.word) || !('speechSynthesis' in window)) return;
  const timer=setTimeout(()=>speakWord(currentWord.en||currentWord.word),250);
  return ()=>clearTimeout(timer);
},[isFlipped,currentWord?.en,currentWord?.word]);
  
useEffect(()=>{  
const handleKeyDown=e=>{  
if(mainMode==='review_setup'||mainMode==='review_done')return;  
if(e.key==='ArrowLeft')handlePrev();  
else if(e.key==='ArrowRight')handleNext();  
else if(e.key===' '||e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();toggleFlip()}  
};  
window.addEventListener('keydown',handleKeyDown);  
return()=>window.removeEventListener('keydown',handleKeyDown);  
},[mainMode,currentIndex,reviewIndex,isFlipped,words,reviewQueue]);  
  
const handleFileUpload=event=>{  
const file=event.target.files[0];  
if(!file)return;  
const reader=new FileReader();  
reader.onload=async e=>{  
const content=e.target.result;  
let parsedData=null;  
if(file.name.endsWith('.html')||file.name.endsWith('.htm')||content.includes('<html')||content.includes('vocab-data')){  
parsedData=parseHtmlToWords(content);  
}else{  
try{  
const raw=JSON.parse(content);  
parsedData=raw.map(item=>({...item,group:item.group||"Group 84"}));  
}catch(err){  
setNotice("❌ 檔案內容格式錯誤，請上傳 words.html 或合法 JSON 檔案。");return;  
}  
}  
if(Array.isArray(parsedData)&&parsedData.length>0){
const normalized=parsedData.map((w,i)=>({...w,id:w.id??i+1,group:w.group||"Group 1"}));
const id=`book_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
const title=file.name.replace(/\.(json|html?)$/i,"").replace(/[_-]+/g," ")||"匯入單字書";
const book={id,title,subtitle:"自訂單字書",icon:"📗",color:"from-emerald-600 to-teal-800",builtin:false,words:normalized,createdAt:Date.now(),sourceName:file.name};
setBooks(prev=>{const next=[...prev,book];saveBooks(next);return next;});
setActiveBookId(id);setWords(normalized);setSelectedBankGroup('ALL');setCurrentIndex(0);setIsFlipped(false);
setSelectedReviewGroups([...new Set(normalized.map(w=>w.group||"Group 1"))]);setMainMode('bank');
setNotice(`✅ 已新增單字書「${title}」，共 ${normalized.length} 個單字！`);
}else setNotice("❌ 檔案中未發現有效的單字資料。");  
};  
reader.readAsText(file);event.target.value='';

const handleRate=(level,currentWordId)=>{
  let savedRecords=null;
  if(currentWordId!==undefined&&currentWordId!==null){
    const currentBookId=mainMode==='review_active'?(reviewQueue[reviewIndex]?.__bookId||activeBookId):activeBookId;
    const now=Date.now(),records=loadLearningRecords(),key=learningKey(currentWordId,currentBookId),old=normalizeLearningRecord(records[key]);
    const history=Array.isArray(old.history)?old.history:[];
    const previousLevel=old.mastery||null;
    let score=old.masteryScore!==null&&old.masteryScore!==undefined&&Number.isFinite(Number(old.masteryScore))?Number(old.masteryScore):(previousLevel?MASTERY_BASE_SCORE[previousLevel]:null);
    if(score===null){score=MASTERY_BASE_SCORE[level];}
    else{
      const lastEvent=history[history.length-1];
      const previousReviewAt=lastEvent?.at||old.lastReviewedAt;
      const gap=previousReviewAt?now-(Number(previousReviewAt)||now):Infinity;
      // 同一短時段的重複評分資訊量較低；跨日證據權重較高。
      const evidenceFactor=gap<10*60*1000?.35:gap<24*60*60*1000?.65:gap>=3*24*60*60*1000?1.15:1;
      const delta={red:-12,yellow:-5,green:5,blue:9}[level]||0;
      score=clampScore(score+delta*evidenceFactor);
    }
    const mastery=resolveMastery(score,previousLevel||level);
    const event={rating:level,at:now,scoreAfter:score,masteryAfter:mastery};
    records[key]={...old,[level]:(Number(old[level])||0)+1,mastery,masteryScore:score,lastReviewedAt:now,history:[...history,event].slice(-200)};
    saveLearningRecords(records);savedRecords=records;
    setCardMastery(prev=>({...prev,[key]:mastery}));setLastReviewedAt(prev=>({...prev,[key]:now}));
  }
  setStats(prev=>({...prev,[level]:prev[level]+1}));
  if(mainMode==='bank')handleNext();
  else if(mainMode==='review_active'){
    setReviewCompletedCount(prev=>prev+1);
    if(reviewIndex<reviewQueue.length-1){rememberCurrentReviewCard();setIsFlipped(false);setTimeout(()=>setReviewIndex(prev=>prev+1),120);}
    else if(reviewModeType==='single')setMainMode('review_done');
    else{
      rememberCurrentReviewCard();
      const next=chooseWeightedWord(reviewPoolRef.current,savedRecords||loadLearningRecords(),recentReviewKeysRef.current);
      if(next){const key=learningKey(next.id,next.__bookId||activeBookId);recentReviewKeysRef.current=[...recentReviewKeysRef.current,key].slice(-12);setReviewQueue(prev=>[...prev,next]);setIsFlipped(false);setTimeout(()=>setReviewIndex(prev=>prev+1),120);}
    }
  }
};

const startReviewSession=async()=>{
  if(crossBookQuiz&&selectedReviewBookIds.length===0){setNotice("請至少選擇一本書。");return;}
  if(!crossBookQuiz&&selectedReviewGroups.length===0){setNotice("請至少選擇一個複習組別！");return;}
  const requestId=++reviewStartRequestRef.current;
  let allReviewWords=[];
  if(crossBookQuiz){
    const chunks=await Promise.all(selectedReviewBookIds.map(async bookId=>{
      if(bookId===BUILTIN_BOOK_ID){const data=await loadAllGroups();return data.map(w=>({...w,__bookId:BUILTIN_BOOK_ID,__bookTitle:BUILTIN_BOOK.title}));}
      const book=books.find(b=>b.id===bookId);return (book?.words||[]).map(w=>({...w,__bookId:bookId,__bookTitle:book.title}));
    }));
    allReviewWords=chunks.flat();
  }else if(activeBook.id===BUILTIN_BOOK_ID){
    const groupNumbers=selectedReviewGroups.map(name=>Number(name.replace('Group ',''))).filter(n=>Number.isInteger(n)&&n>=1&&n<=90);
    if(!groupNumbers.length){setNotice("沒有有效的複習組別！");return;}
    allReviewWords=await loadGroups(groupNumbers);if(!Array.isArray(allReviewWords))return;
    allReviewWords=allReviewWords.map(w=>({...w,__bookId:BUILTIN_BOOK_ID,__bookTitle:BUILTIN_BOOK.title}));
  }else allReviewWords=(activeBook.words||words).filter(w=>selectedReviewGroups.includes(w.group||'Group 1')).map(w=>({...w,__bookId:activeBookId,__bookTitle:activeBook.title}));
  if(requestId!==reviewStartRequestRef.current)return;
  let pool=allReviewWords.filter(word=>{
    const bookId=word.__bookId||activeBookId;
    if(Object.values(reviewMasteries).some(Boolean)){const mastery=cardMastery[learningKey(word.id,bookId)];if(!mastery||!reviewMasteries[mastery])return false;}
    const star=starredWords[learningKey(word.id,bookId)]||{yellow:false,blue:false};
    if(reviewStars.yellow&&!star.yellow)return false;if(reviewStars.blue&&!star.blue)return false;
    if(useDaysFilter&&reviewDaysInput>0){const last=lastReviewedAt[learningKey(word.id,bookId)];if(last&&(Date.now()-last)/(1000*60*60*24)<reviewDaysInput)return false;}
    return true;
  });
  if(pool.length===0){setNotice("沒有符合條件的單字；All+ 目前尚未加入單字資料。");return;}
  pool=shuffleArray(pool);if(!isInfiniteCount&&reviewCountInput>0)pool=pool.slice(0,Number(reviewCountInput));
  reviewPoolRef.current=pool;
  recentReviewKeysRef.current=[];
  if(reviewModeType==='endless'){
    const first=chooseWeightedWord(pool,loadLearningRecords(),[]);
    const firstKey=first?learningKey(first.id,first.__bookId||activeBookId):null;
    if(firstKey)recentReviewKeysRef.current=[firstKey];
    setReviewQueue(first?[first]:[]);
  }else setReviewQueue(pool);
  setReviewIndex(0);setReviewCompletedCount(0);setIsFlipped(false);setMainMode('review_active');setNotice(`已載入 ${pool.length} 張${crossBookQuiz?'跨書':''}候選卡；${reviewModeType==='endless'?'無盡模式將依熟練度、歷史表現與冷卻機制動態抽卡。':'本次採隨機不重複出卡。'}`);
};

const exportProgressBackup=()=>{
  try{
    const records=JSON.parse(localStorage.getItem(LEARNING_STORAGE_KEY)||'{}')||{};
    const activity=JSON.parse(localStorage.getItem(DAILY_ACTIVITY_KEY)||'{}')||{};
    const customBooks=JSON.parse(localStorage.getItem(BOOKS_STORAGE_KEY)||'[]')||[];
    // 除了每張卡的統計紀錄，也輸出一份攤平的逐次複習事件表，方便檢查時間序列。
    // 舊版只有按鈕次數的資料不會有 history，不能憑空補出過去的時間。
    const reviewHistory=Object.entries(records).flatMap(([wordKey,raw])=>{
      const events=Array.isArray(raw?.history)?raw.history:[];
      return events.map((event,index)=>({wordKey,index, rating:event.rating||null,at:event.at||null,scoreAfter:event.scoreAfter??null,masteryAfter:event.masteryAfter??null}));
    }).filter(event=>event.at).sort((a,b)=>new Date(a.at).getTime()-new Date(b.at).getTime());
    const backup={
      format:'lexicon-studio-progress-backup',
      version:2,
      exportedAt:new Date().toISOString(),
      learningRecords:records,
      reviewHistory,
      dailyActivity:activity,
      customBooks:Array.isArray(customBooks)?customBooks:[]
    };
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`單字卡學習紀錄備份_${localDayKey()}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    setNotice(`備份已匯出：${Object.keys(records).length} 筆字卡紀錄、${reviewHistory.length} 筆有時間戳的複習事件。舊版只有次數的紀錄無法還原過去時間；新版本之後的按鈕操作會逐次記錄時間。請確認檔案已存入 iPad「檔案」App。`);
  }catch(e){
    console.error('匯出備份失敗',e);
    setNotice('匯出失敗。請確認瀏覽器允許下載，或稍後再試。');
  }
};
const importProgressBackup=async(event)=>{
  const file=event.target.files?.[0];
  event.target.value='';
  if(!file)return;
  try{
    const backup=JSON.parse(await file.text());
    if(!backup||backup.format!=='lexicon-studio-progress-backup'||!backup.learningRecords||typeof backup.learningRecords!=='object'||Array.isArray(backup.learningRecords)){
      setNotice('這不是有效的單字卡學習紀錄備份，沒有更動任何資料。');return;
    }
    const incomingRecords=backup.learningRecords;
    const currentRecords=JSON.parse(localStorage.getItem(LEARNING_STORAGE_KEY)||'{}')||{};
    const mergedRecords={...currentRecords,...incomingRecords};
    const currentActivity=JSON.parse(localStorage.getItem(DAILY_ACTIVITY_KEY)||'{}')||{};
    const incomingActivity=backup.dailyActivity&&typeof backup.dailyActivity==='object'?backup.dailyActivity:{};
    const mergedActivity={...currentActivity};
    Object.entries(incomingActivity).forEach(([day,count])=>{mergedActivity[day]=Math.max(Number(mergedActivity[day])||0,Number(count)||0);});
    const currentBooks=JSON.parse(localStorage.getItem(BOOKS_STORAGE_KEY)||'[]')||[];
    const incomingBooks=Array.isArray(backup.customBooks)?backup.customBooks:[];
    const bookMap=new Map();
    [...(Array.isArray(currentBooks)?currentBooks:[]),...incomingBooks].forEach(book=>{
      if(book&&book.id&&book.id!==BUILTIN_BOOK_ID&&book.id!==ALLPLUS_BOOK.id)bookMap.set(book.id,book);
    });
    const mergedBooks=[...bookMap.values()];
    const recordCount=Object.keys(incomingRecords).length;
    if(!window.confirm(`準備匯入備份（${recordCount} 筆字卡紀錄）。\n\n同一張字卡若有重複紀錄，將以備份檔中的資料為準；只有目前存在的紀錄會保留。每日活動次數採較大值，避免重複相加。\n\n是否繼續？`))return;
    localStorage.setItem(LEARNING_STORAGE_KEY,JSON.stringify(mergedRecords));
    localStorage.setItem(DAILY_ACTIVITY_KEY,JSON.stringify(mergedActivity));
    localStorage.setItem(BOOKS_STORAGE_KEY,JSON.stringify(mergedBooks));
    const state=buildLearningState(mergedRecords);
    setStats(state.stats);setStarredWords(state.starred);setCardMastery(state.mastery);setLastReviewedAt(state.lastReviewedAt);
    setDailyActivity(mergedActivity);
    setBooks([BUILTIN_BOOK,ALLPLUS_BOOK,...mergedBooks]);
    setNotice(`匯入完成！目前共有 ${Object.keys(mergedRecords).length} 筆字卡紀錄。原本只存在於此裝置的其他紀錄已保留。`);
  }catch(e){
    console.error('匯入備份失敗',e);
    setNotice('無法讀取這個備份檔，資料沒有成功匯入。請選擇單字卡匯出的 JSON 備份。');
  }
};

<div className="bg-[#131825] rounded-2xl p-4 mb-4 border border-indigo-900/50 shadow-md">  
<div className="flex justify-between items-center text-xs text-indigo-300 font-semibold mb-2">  
<span className="flex items-center gap-1.5"><span className="bg-indigo-900/60 px-2 py-0.5 rounded border border-indigo-700/50">{reviewModeType==='single'?'🏆 單次闖關':'♾️ 無盡循環'}</span></span>  
<button onClick={()=>setMainMode('review_setup')} className="text-[11px] text-gray-400 hover:text-white px-2 py-0.5 rounded border border-gray-700 bg-gray-900/60 transition-colors">⏹️ 結束複習</button>  
</div>  
<div className="h-2 w-full bg-gray-800 rounded-full mb-2 overflow-hidden"><div className="h-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all duration-300 ease-out" style={{width:`${progressPercentage}%`}}></div></div>  
<div className="flex justify-between items-center text-xs text-gray-400 font-medium">  
<span>{reviewModeType==='single'?`進度 (${reviewIndex+1} / ${reviewQueue.length})`:`已完成 ${reviewCompletedCount} 次 (當前第 ${reviewIndex+1} / ${reviewQueue.length} 張)`}</span>  
<div className="flex items-center gap-2 font-mono text-[11px]">  
<span title="陌生"><strong className="text-rose-400">🔴 {stats.red}</strong></span>  
<span title="生疏"><strong className="text-amber-400">🟡 {stats.yellow}</strong></span>  
<span title="熟練"><strong className="text-emerald-400">🟢 {stats.green}</strong></span>  
<span title="精通"><strong className="text-blue-400">🔵 {stats.blue}</strong></span>  
</div>  
</div>  
</div>  
)}  
  
{(mainMode==='bank'||mainMode==='review_active')&&(  
<>  
{(!currentWord||!currentWord.en)?(  
<div className="bg-[#131825] rounded-2xl p-12 border border-gray-800 text-center my-8 text-gray-400 text-xs">此篩選條件下沒有找到任何單字卡。</div>  
):(  
<>  
<div className="relative w-full h-96 perspective-1000 cursor-pointer mb-6 group" onClick={toggleFlip}>  
<div className={`w-full h-full duration-500 transform-style-3d relative transition-transform ${isFlipped?'rotate-y-180':''}`}>  
  
<div className="absolute inset-0 w-full h-full backface-hidden bg-[#131825] rounded-2xl p-6 border border-gray-800 shadow-xl flex flex-col justify-between">  
{renderCardHeader()}  
<div className="flex flex-col items-center justify-center text-center my-auto">  
<span className="text-xs text-indigo-400 font-mono mb-1.5 bg-indigo-950/60 px-2.5 py-0.5 rounded-full border border-indigo-800/50">{currentWord.group||"Group 84"}</span>  
<h2 className="text-5xl font-extrabold text-white tracking-wide mb-3">{currentWord.en||currentWord.word}</h2>  
{currentWord.pos&&<span className="text-indigo-400 text-sm italic font-medium bg-indigo-950/40 px-3 py-1 rounded-full border border-indigo-800/50">{currentWord.pos}</span>}  
</div>  
<div className="text-center text-gray-500 text-xs flex items-center justify-center gap-1">💡 點擊卡片翻轉查看解釋</div>  
</div>  
  
<div className="absolute inset-0 w-full h-full backface-hidden bg-[#1a1f30] rounded-2xl p-6 border border-indigo-900/50 shadow-xl flex flex-col justify-between rotate-y-180 overflow-y-auto">  
<div>  
{renderCardHeader()}  
<div className="flex flex-wrap items-baseline justify-start gap-x-2 gap-y-1 mt-3 mb-2">  
<div className="text-2xl font-bold text-white">{currentWord.en||currentWord.word}</div>  
{currentWord.pos&&<span className="text-indigo-400 text-xs italic font-mono bg-indigo-950/40 px-2.5 py-0.5 rounded-full border border-indigo-800/50">{currentWord.pos}</span>}  
</div>  
<div className="text-xl text-emerald-400 font-semibold mb-2 border-b border-gray-800 pb-2">{currentWord.zh||currentWord.meaning}</div>  
{(()=>{const raw=currentWord.synonyms??currentWord.synonym??currentWord.nearSynonyms??currentWord["近義詞"];const values=Array.isArray(raw)?raw:typeof raw==="string"?raw.split(/[;,，、]/).map(v=>v.trim()).filter(Boolean):[];return values.length>0?<div className="text-sm text-left bg-gray-900/60 p-2.5 rounded-lg border border-gray-800 mb-3"><span className="text-amber-300 font-semibold">近義詞：</span><span className="text-gray-200">{values.join(", ")}</span></div>:null;})()}  
{renderExample(currentWord.ex)}  
<div className="mt-3 space-y-2 text-xs text-left">  
{currentWord.root&&<div className="bg-gray-900/60 p-2.5 rounded-lg border border-gray-800"><span className="text-indigo-400 font-semibold">字根字源：</span><span className="text-gray-300">{currentWord.root}</span></div>}  
{currentWord.mem&&<div className="bg-gray-900/60 p-2.5 rounded-lg border border-gray-800"><span className="text-indigo-400 font-semibold">記憶聯想：</span><span className="text-gray-300">{currentWord.mem}</span></div>}  
</div>  
</div>  
  
<div className="grid grid-cols-4 gap-1.5 mt-4 pt-2 border-t border-gray-800">  
<button onClick={e=>{e.stopPropagation();handleRate('red',currentWord.id)}} className="py-2.5 rounded-xl bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 border border-rose-800/60 text-xs font-semibold transition-colors active:scale-95 text-center" title="沒聽過/完全不記得">🔴 陌生</button>  
<button onClick={e=>{e.stopPropagation();handleRate('yellow',currentWord.id)}} className="py-2.5 rounded-xl bg-amber-950/60 hover:bg-amber-900/80 text-amber-300 border border-amber-800/60 text-xs font-semibold transition-colors active:scale-95 text-center" title="不太記得意思">🟡 生疏</button>  
<button onClick={e=>{e.stopPropagation();handleRate('green',currentWord.id)}} className="py-2.5 rounded-xl bg-emerald-950/60 hover:bg-emerald-900/80 text-emerald-300 border border-emerald-800/60 text-xs font-semibold transition-colors active:scale-95 text-center" title="掌握部分字義，有些不清楚">🟢 熟練</button>  
<button onClick={e=>{e.stopPropagation();handleRate('blue',currentWord.id)}} className="py-2.5 rounded-xl bg-blue-950/60 hover:bg-blue-900/80 text-blue-300 border border-blue-800/60 text-xs font-semibold transition-colors active:scale-95 text-center" title="完全掌握，能馬上秒答">🔵 精通</button>  
</div>  
</div>  
  
</div>  
</div>  
  
<div className="flex justify-between items-center gap-2 mb-4">  
<button onClick={handlePrev} disabled={mainMode==='bank'?currentIndex===0:reviewIndex===0} className={`flex-1 py-3 rounded-xl border text-xs font-medium transition-all ${(mainMode==='bank'?currentIndex===0:reviewIndex===0)?'bg-gray-900 text-gray-600 border-gray-800 cursor-not-allowed':'bg-[#131825] text-gray-200 border-gray-700 hover:bg-gray-800 active:scale-95'}`}>← 上一個</button>  
<button onClick={toggleFlip} className="flex-1 py-3 rounded-xl border border-indigo-700/60 bg-indigo-900/40 hover:bg-indigo-900/60 text-xs font-semibold text-indigo-200 transition-all active:scale-95">翻轉卡片 ↻</button>  
<button onClick={handleNext} disabled={mainMode==='bank'?currentIndex===totalBankCount-1:(reviewModeType==='single'&&reviewIndex===reviewQueue.length-1)} className={`flex-1 py-3 rounded-xl border text-xs font-medium transition-all ${(mainMode==='bank'?currentIndex===totalBankCount-1:(reviewModeType==='single'&&reviewIndex===reviewQueue.length-1))?'bg-gray-900 text-gray-600 border-gray-800 cursor-not-allowed':'bg-[#131825] text-gray-200 border-gray-700 hover:bg-gray-800 active:scale-95'}`}>下一個 →</button>  
</div>  
<div className="text-center text-gray-600 text-[11px]">鍵盤快捷鍵：← 上一個 | → 下一個 | 空格鍵/上下鍵 翻轉</div>  
</>  
)}  
</>  
)}  
  
<nav className="fixed z-40 bottom-3 left-1/2 -translate-x-1/2 w-[calc(100%-24px)] max-w-xl rounded-2xl border border-white/10 bg-[#111625]/95 backdrop-blur-xl shadow-2xl shadow-black/50 p-1.5 grid grid-cols-3 gap-1">
  <button onClick={()=>setMainMode('home')} className={`rounded-xl py-2.5 flex flex-col items-center gap-1 transition ${pageKey==='home'?'bg-violet-500/15 text-violet-200':'text-slate-500 hover:text-slate-200'}`}><span className="text-lg leading-none">⌂</span><span className="text-[10px] font-bold">主頁</span></button>
  <button onClick={()=>setMainMode('shelf')} className={`rounded-xl py-2.5 flex flex-col items-center gap-1 transition ${pageKey==='shelf'?'bg-violet-500/15 text-violet-200':'text-slate-500 hover:text-slate-200'}`}><span className="text-lg leading-none">▤</span><span className="text-[10px] font-bold">書庫</span></button>
  <button onClick={()=>{setMainMode('review_setup');setIsFlipped(false)}} className={`rounded-xl py-2.5 flex flex-col items-center gap-1 transition ${pageKey==='quiz'?'bg-violet-500/15 text-violet-200':'text-slate-500 hover:text-slate-200'}`}><span className="text-lg leading-none">◎</span><span className="text-[10px] font-bold">測驗</span></button>
</nav>

{showHelpModal&&(  
<div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={()=>setShowHelpModal(false)}>  
<div className="bg-[#131825] border border-gray-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl text-left" onClick={e=>e.stopPropagation()}>  
<div className="flex justify-between items-center mb-3 border-b border-gray-800 pb-2">  
<h3 className="text-base font-bold text-white">熟練度等級說明</h3>  
<button onClick={()=>setShowHelpModal(false)} className="text-gray-400 hover:text-white font-bold text-sm">✕</button>  
</div>  
<ul className="space-y-3 text-xs leading-relaxed">  
<li className="flex gap-2"><span className="text-blue-400 font-bold shrink-0">🔵 精通：</span><span className="text-gray-300">完全掌握，一顯示英文就能馬上答出中文意思。</span></li>  
<li className="flex gap-2"><span className="text-emerald-400 font-bold shrink-0">🟢 熟練：</span><span className="text-gray-300">能掌握大部分字義，但有些延伸意思不夠熟悉。</span></li>  
<li className="flex gap-2"><span className="text-amber-400 font-bold shrink-0">🟡 生疏：</span><span className="text-gray-300">不太記得意思，需思考較久或依靠提示。</span></li>  
<li className="flex gap-2"><span className="text-rose-400 font-bold shrink-0">🔴 陌生：</span><span className="text-gray-300">沒聽過或完全不記得此單字。</span></li>  
</ul>  
<button onClick={()=>setShowHelpModal(false)} className="mt-5 w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition-colors">知道了</button>  
</div>  
</div>  
)}  
  
</div>  
);  
}  
  
const root=ReactDOM.createRoot(document.getElementById('root'));  
root.render(<FlashcardApp/>);  
</script>  
</body>  
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單字記憶卡片</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --panel-bg: #1e1e1e;
            --card-bg: #2a2a2a;
            --text-main: #ffffff;
            --text-sub: #a0a0a0;
            --accent-blue: #5e5ce6;
            --accent-red: #ff453a;
            --accent-green: #32d74b;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        /* 頂部 Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .group-badge {
            background-color: rgba(94, 92, 230, 0.2);
            color: #8c8aff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .header-title {
            font-size: 1.1em;
            font-weight: bold;
        }
        .header-actions button {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85em;
            margin-left: 5px;
            transition: 0.2s;
        }
        .header-actions button:hover {
            background: #333;
            color: white;
        }

        /* 控制面板 (模式與群組選擇) */
        .controls-panel {
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .mode-toggle {
            display: flex;
            background-color: #151515;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .mode-btn {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            cursor: pointer;
            font-size: 0.9em;
            color: var(--text-sub);
            transition: 0.3s;
        }
        .mode-btn.active {
            background-color: rgba(94, 92, 230, 0.3);
            color: #8c8aff;
            font-weight: bold;
        }
        .group-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-height: 100px;
            overflow-y: auto;
        }
        .group-label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9em;
            color: var(--text-sub);
            cursor: pointer;
        }
        .group-label input[type="checkbox"] {
            accent-color: var(--accent-blue);
        }

        /* 進度條與狀態 */
        .progress-container {
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .progress-bar-bg {
            background-color: #333;
            height: 4px;
            border-radius: 2px;
            width: 100%;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background-color: var(--accent-blue);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: var(--text-sub);
        }

        /* 卡片區塊 */
        .scene {
            width: 100%;
            min-height: 400px;
            perspective: 1000px;
            margin-bottom: 20px;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card.is-flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }
        
        /* 卡片正面 */
        .card-front {
            align-items: center;
            justify-content: center;
        }
        .front-header {
            position: absolute;
            top: 20px;
            width: calc(100% - 40px);
            display: flex;
            justify-content: space-between;
            color: var(--text-sub);
            font-size: 0.85em;
        }
        .word-main {
            font-size: 3em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-audio {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 0.5em;
            padding: 5px;
        }
        .btn-audio:hover { color: white; }
        .word-pos {
            color: var(--text-sub);
            font-style: italic;
            margin-top: 10px;
            font-size: 1.1em;
        }
        .flip-hint {
            position: absolute;
            bottom: 20px;
            color: #555;
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        /* 卡片背面 */
        .card-back {
            transform: rotateY(180deg);
            justify-content: flex-start;
            overflow-y: auto;
        }
        .back-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .back-word {
            font-size: 1.5em;
            font-weight: bold;
        }
        .back-pos {
            color: var(--text-sub);
            font-size: 0.6em;
            font-weight: normal;
            margin-left: 5px;
        }
        .back-id {
            color: var(--text-sub);
            font-size: 0.85em;
            background: #111;
            padding: 3px 8px;
            border-radius: 8px;
        }
        .meaning {
            font-size: 1.1em;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .example-box {
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        .example-en { margin-bottom: 5px; line-height: 1.3;}
        .example-zh { color: var(--text-sub); }
        
        /* 重點：字根與記憶兩欄並排 */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .info-cell {
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85em;
        }
        .info-title {
            color: var(--text-sub);
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        .info-content {
            line-height: 1.4;
        }

        /* 複習按鈕區 (背面底部) */
        .review-actions {
            display: flex;
            gap: 15px;
            margin-top: auto;
        }
        .btn-review {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }
        .btn-forget {
            background-color: rgba(255, 69, 58, 0.15);
            color: var(--accent-red);
        }
        .btn-forget:hover { background-color: rgba(255, 69, 58, 0.25); }
        .btn-remember {
            background-color: rgba(50, 215, 75, 0.15);
            color: var(--accent-green);
        }
        .btn-remember:hover { background-color: rgba(50, 215, 75, 0.25); }

        /* 底部導覽列 */
        .bottom-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .nav-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .nav-btn:hover { background: #333; color: white; }
        
        .start-btn {
            width: 100%;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        .start-btn:hover { opacity: 0.8; }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <span class="group-badge" id="current-group-badge">Group --</span>
            <span class="header-title">單字記憶卡片</span>
        </div>
        <div class="header-actions">
            <label for="jsonInput">
                <button onclick="document.getElementById('jsonInput').click()">↑ JSON</button>
            </label>
            <input type="file" id="jsonInput" accept=".json" onchange="importJSON(event)">
            <button onclick="clearData()">↺ 重置</button>
        </div>
    </div>

    <!-- 設定面板 (遊戲開始前顯示，開始後隱藏) -->
    <div class="controls-panel" id="setup-panel">
        <div class="mode-toggle">
            <div class="mode-btn active" id="mode-once" onclick="setMode('once')">單次打亂過關</div>
            <div class="mode-btn" id="mode-endless" onclick="setMode('endless')">動態權重無盡</div>
        </div>
        <div style="font-size: 0.85em; color: var(--text-sub); margin-bottom: 10px;">請選擇要複習的群組：</div>
        <div class="group-selector" id="group-checkboxes">
            <!-- Checkboxes 將由 JS 產生 -->
        </div>
        <button class="start-btn" onclick="startGame()">開始學習</button>
    </div>

    <!-- 遊戲面板 (隱藏直到開始) -->
    <div id="game-panel" style="display: none;">
        <!-- 進度條 -->
        <div class="progress-container">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <div class="stats-row">
                <span id="progress-text">卡片 0 / 0</span>
                <span>熟練: <span id="stat-mastered">0</span> | 待加強: <span id="stat-review">0</span></span>
            </div>
        </div>

        <!-- 卡片區 -->
        <div class="scene">
            <div class="card" id="flashcard">
                <!-- 正面 -->
                <div class="card-face card-front" onclick="flipCard()">
                    <div class="front-header">
                        <span id="front-id">ID: --</span>
                        <span class="group-badge" id="front-group">Group --</span>
                    </div>
                    <div style="text-align: center;">
                        <div class="word-main">
                            <span id="front-word">Word</span>
                            <button class="btn-audio" onclick="event.stopPropagation(); speakWord(document.getElementById('front-word').innerText)">🔊</button>
                        </div>
                        <div class="word-pos" id="front-pos">adj. / v.</div>
                    </div>
                    <div class="flip-hint">↻ 點擊卡片翻面看解答</div>
                </div>

                <!-- 背面 -->
                <div class="card-face card-back">
                    <div class="back-header">
                        <div class="back-word" id="back-word">word<span class="back-pos" id="back-pos">adj. / v.</span></div>
                        <div class="back-id" id="back-id">ID: --</div>
                    </div>
                    
                    <div class="meaning" id="back-zh">中文意思</div>
                    
                    <div class="example-box">
                        <div class="example-en" id="back-ex-en">Example sentence.</div>
                        <div class="example-zh" id="back-ex-zh">例句中文翻譯。</div>
                    </div>

                    <!-- 重點：兩欄並排的結構 -->
                    <div class="info-grid">
                        <div class="info-cell">
                            <div class="info-title">詞根 / 結構</div>
                            <div class="info-content" id="back-root">字根說明</div>
                        </div>
                        <div class="info-cell">
                            <div class="info-title">記憶助記 Tip</div>
                            <div class="info-content" id="back-mem">記憶法說明</div>
                        </div>
                    </div>

                    <div class="review-actions">
                        <button class="btn-review btn-forget" onclick="handleReview(false)">⊗ 沒記住</button>
                        <button class="btn-review btn-remember" onclick="handleReview(true)">✓ 記住了</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部導覽 -->
        <div class="bottom-nav">
            <button class="nav-btn" onclick="prevCard()">← 上一個</button>
            <button class="nav-btn" onclick="flipCard()">翻轉卡片 ↻</button>
            <button class="nav-btn" onclick="nextCard()">下一個 →</button>
        </div>
        
        <button class="nav-btn" style="width: 100%; margin-top: 15px; border-color: #555;" onclick="endGame()">退出學習</button>
    </div>

</div>

<script>
    let words = JSON.parse(localStorage.getItem('vocabData')) || [];
    let userStats = JSON.parse(localStorage.getItem('vocabStats')) || {};
    
    let currentQueue = [];
    let currentIndex = 0;
    let selectedMode = 'once'; // 'once' 或 'endless'
    let masteredCount = 0;
    let reviewCount = 0;

    // 初始化 UI
    function initUI() {
        let groups = new Set();
        words.forEach(w => groups.add(Math.ceil(w.id / 50)));
        let groupArr = Array.from(groups).sort((a,b) => a - b);

        let checkboxContainer = document.getElementById('group-checkboxes');
        checkboxContainer.innerHTML = '';
        
        if (groupArr.length === 0) {
            checkboxContainer.innerHTML = '<span style="color:#777">尚無資料，請先匯入 JSON 單字庫。</span>';
            return;
        }

        groupArr.forEach(g => {
            let label = document.createElement('label');
            label.className = 'group-label';
            // 抓取該群組範圍
            let startId = (g - 1) * 50 + 1;
            let endId = g * 50;
            label.innerHTML = `<input type="checkbox" value="${g}" class="group-cb" checked> Group ${g} (${startId}~${endId})`;
            checkboxContainer.appendChild(label);
        });
    }

    // JSON 匯入
    function importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const incomingData = JSON.parse(e.target.result);
                incomingData.forEach(newWord => {
                    let existIndex = words.findIndex(w => w.id === newWord.id);
                    if (existIndex !== -1) {
                        words[existIndex] = { ...words[existIndex], ...newWord };
                    } else {
                        words.push(newWord);
                    }
                });
                words.sort((a, b) => a.id - b.id);
                localStorage.setItem('vocabData', JSON.stringify(words));
                alert("匯入成功！");
                initUI();
            } catch (err) {
                alert("JSON 格式錯誤！");
            }
            event.target.value = ''; // Reset input
        };
        reader.readAsText(file);
    }

    function clearData() {
        if(confirm("確定要清除所有單字與學習紀錄嗎？")) {
            localStorage.removeItem('vocabData');
            localStorage.removeItem('vocabStats');
            words = [];
            userStats = {};
            initUI();
        }
    }

    // 模式切換
    function setMode(mode) {
        selectedMode = mode;
        document.getElementById('mode-once').classList.remove('active');
        document.getElementById('mode-endless').classList.remove('active');
        document.getElementById(`mode-${mode}`).classList.add('active');
    }

    // 計算權重 (無盡模式用)
    function getWeight(wordId) {
        let stats = userStats[wordId] || { correct: 0, wrong: 0, lastReview: 0 };
        let weight = 100; 
        weight += stats.wrong * 50;
        weight /= (stats.correct + 1);
        if (stats.lastReview > 0) {
            let days = (Date.now() - stats.lastReview) / (1000 * 3600 * 24);
            weight += (days * 10);
        }
        return Math.max(1, weight);
    }

    // 開始遊戲
    function startGame() {
        let selectedGroups = Array.from(document.querySelectorAll('.group-cb:checked')).map(cb => parseInt(cb.value));
        if (selectedGroups.length === 0) return alert("請至少選擇一個群組！");

        let pool = words.filter(w => selectedGroups.includes(Math.ceil(w.id / 50)));
        if (pool.length === 0) return alert("選取的群組無單字！");

        if (selectedMode === 'once') {
            currentQueue = pool.sort(() => Math.random() - 0.5); // 單次打亂
        } else {
            // 無盡模式初始塞入30題 (會動態補充)
            currentQueue = [];
            for(let i=0; i<30; i++) {
                currentQueue.push(weightedRandomChoice(pool));
            }
        }

        currentIndex = 0;
        masteredCount = 0;
        reviewCount = 0;
        
        document.getElementById('setup-panel').style.display = 'none';
        document.getElementById('game-panel').style.display = 'block';
        updateCardContent();
    }

    function weightedRandomChoice(pool) {
        let totalWeight = pool.reduce((sum, w) => sum + getWeight(w.id), 0);
        let random = Math.random() * totalWeight;
        for (let w of pool) {
            random -= getWeight(w.id);
            if (random <= 0) return w;
        }
        return pool[0];
    }

    // 更新卡片內容
    function updateCardContent() {
        if (currentIndex >= currentQueue.length) {
            alert("本階段任務完成！");
            endGame();
            return;
        }

        const card = document.getElementById('flashcard');
        card.classList.remove('is-flipped'); // 確保顯示正面

        const word = currentQueue[currentIndex];
        const groupId = Math.ceil(word.id / 50);
        
        // Header Info
        document.getElementById('current-group-badge').textContent = `Group ${groupId}`;
        
        // Front
        document.getElementById('front-id').textContent = `ID: ${word.id}`;
        document.getElementById('front-group').textContent = `Group ${groupId}`;
        document.getElementById('front-word').textContent = word.en;
        document.getElementById('front-pos').textContent = word.pos;

        // Back
        document.getElementById('back-id').textContent = `ID: ${word.id}`;
        document.getElementById('back-word').innerHTML = `${word.en} <span class="back-pos">${word.pos}</span>`;
        document.getElementById('back-zh').textContent = word.zh;
        
        // 處理例句 (將中英拆分，如果只有一句就全放英文區)
        let exText = word.ex || '無';
        if(exText.includes('\n') || exText.includes('<br>')) {
             let parts = exText.split(/\n|<br>/);
             document.getElementById('back-ex-en').innerHTML = parts[0];
             document.getElementById('back-ex-zh').innerHTML = parts[1] || '';
        } else {
             document.getElementById('back-ex-en').textContent = exText;
             document.getElementById('back-ex-zh').textContent = '';
        }

        document.getElementById('back-root').textContent = word.root || '無';
        document.getElementById('back-mem').textContent = word.mem || '無';

        updateStats();
    }

    function updateStats() {
        document.getElementById('stat-mastered').textContent = masteredCount;
        document.getElementById('stat-review').textContent = reviewCount;
        
        if (selectedMode === 'once') {
            document.getElementById('progress-text').textContent = `卡片 ${currentIndex + 1} / ${currentQueue.length}`;
            let percent = ((currentIndex) / currentQueue.length) * 100;
            document.getElementById('progress-fill').style.width = `${percent}%`;
        } else {
            document.getElementById('progress-text').textContent = `無盡模式 (第 ${currentIndex + 1} 張)`;
            document.getElementById('progress-fill').style.width = `100%`;
        }
    }

    // 翻轉卡片
    function flipCard() {
        const card = document.getElementById('flashcard');
        card.classList.toggle('is-flipped');
        if (card.classList.contains('is-flipped')) {
            speakWord(currentQueue[currentIndex].en);
        }
    }

    // 發音
    function speakWord(text) {
        let msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'en-US';
        window.speechSynthesis.speak(msg);
    }

    // 處理背面按鈕 (記住/沒記住)
    function handleReview(isCorrect) {
        let wordId = currentQueue[currentIndex].id;
        if (!userStats[wordId]) userStats[wordId] = { correct: 0, wrong: 0, lastReview: 0 };
        
        if (isCorrect) {
            userStats[wordId].correct++;
            masteredCount++;
        } else {
            userStats[wordId].wrong++;
            reviewCount++;
            // 單次模式如果答錯，可以把題目塞到陣列最後面強迫複習
            if (selectedMode === 'once') {
                currentQueue.push(currentQueue[currentIndex]);
            }
        }
        userStats[wordId].lastReview = Date.now();
        localStorage.setItem('vocabStats', JSON.stringify(userStats));

        nextCard(true); // 自動跳下一張
    }

    // 底部導航邏輯
    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            updateCardContent();
        }
    }

    function nextCard(fromReview = false) {
        // 如果是無盡模式且快沒題目了，動態補充
        if (selectedMode === 'endless' && currentIndex >= currentQueue.length - 5) {
            let selectedGroups = Array.from(document.querySelectorAll('.group-cb:checked')).map(cb => parseInt(cb.value));
            let pool = words.filter(w => selectedGroups.includes(Math.ceil(w.id / 50)));
            for(let i=0; i<5; i++) {
                currentQueue.push(weightedRandomChoice(pool));
            }
        }

        // 如果不是按了記住/沒記住，且卡片在背面，強迫不計分直接下一張
        currentIndex++;
        updateCardContent();
    }

    function endGame() {
        document.getElementById('game-panel').style.display = 'none';
        document.getElementById('setup-panel').style.display = 'block';
        initUI();
    }

    // 初始載入
    initUI();
</script>
</body>
</html>

        function FlashcardApp() {
            const [words, setWords] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [stats, setStats] = useState({ red: 0, yellow: 0, green: 0, blue: 0 });
            const [starredWords, setStarredWords] = useState({}); // { [id]: { yellow: boolean, blue: boolean } }
            const [cardMastery, setCardMastery] = useState({}); // { [id]: 'red' | 'yellow' | 'green' | 'blue' }
            const [lastReviewedAt, setLastReviewedAt] = useState({}); // { [id]: timestamp }
            const [isLoading, setIsLoading] = useState(true);
            const [notice, setNotice] = useState(null);
            const [showHelpModal, setShowHelpModal] = useState(false);

            // 主介面模式：'bank' (單字庫) | 'review_setup' (複習設定) | 'review_active' (進行複習) | 'review_done' (複習完成)
            const [mainMode, setMainMode] = useState('bank');

            // 單字庫模式設定
            const [selectedBankGroup, setSelectedBankGroup] = useState('ALL');
            const [bankStarFilter, setBankStarFilter] = useState({ yellow: false, blue: false });

            // 複習模式設定
            const [selectedReviewGroups, setSelectedReviewGroups] = useState([]);
            const [isInfiniteCount, setIsInfiniteCount] = useState(false);
            const [reviewCountInput, setReviewCountInput] = useState(10);
            const [reviewModeType, setReviewModeType] = useState('single'); // 'single' (單次闖關模式) | 'endless' (無盡循環模式)
            const [useDaysFilter, setUseDaysFilter] = useState(false);
            const [reviewDaysInput, setReviewDaysInput] = useState(7);
            const [reviewMasteries, setReviewMasteries] = useState({ red: false, yellow: false, green: false, blue: false });
            const [reviewStars, setReviewStars] = useState({ yellow: false, blue: false });

            // 進行中的複習佇列
            const [reviewQueue, setReviewQueue] = useState([]);
            const [reviewIndex, setReviewIndex] = useState(0);
            const [reviewCompletedCount, setReviewCompletedCount] = useState(0);

            const fileInputRef = useRef(null);

            const parseHtmlToWords = (htmlText) => {
                try {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, "text/html");
                    
                    const jsonScript = doc.getElementById("vocab-data");
                    if (jsonScript) {
                        const parsed = JSON.parse(jsonScript.textContent);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            return parsed.map(item => ({ ...item, group: item.group || "Group 84" }));
                        }
                    }

                    const items = doc.querySelectorAll(".word-item, [data-en], [data-word]");
                    if (items.length > 0) {
                        const parsed = [];
                        items.forEach((el, index) => {
                            parsed.push({
                                id: el.dataset.id || (index + 1),
                                en: el.dataset.en || el.dataset.word || el.querySelector('.word, .en')?.textContent?.trim() || '',
                                pos: el.dataset.pos || el.querySelector('.pos')?.textContent?.trim() || '',
                                zh: el.dataset.zh || el.dataset.meaning || el.querySelector('.meaning, .zh')?.textContent?.trim() || '',
                                ex: el.dataset.ex || el.querySelector('.ex')?.innerHTML?.trim() || '',
                                root: el.dataset.root || el.querySelector('.root')?.textContent?.trim() || '',
                                mem: el.dataset.mem || el.querySelector('.mem')?.textContent?.trim() || '',
                                group: el.dataset.group || "Group 84"
                            });
                        });
                        return parsed.filter(w => w.en);
                    }
                } catch (e) {
                    console.error("解析 HTML 單字檔失敗:", e);
                }
                return null;
            };

            // 自動載入單字檔
            useEffect(() => {
                const loadVocabData = async () => {
                    setIsLoading(true);
                    let loadedData = null;
                    const filesToTry = ['./words.html', './words.json'];

                    for (const path of filesToTry) {
                        try {
                            const res = await fetch(path);
                            if (res.ok) {
                                const text = await res.text();
                                if (path.endsWith('.html') || text.includes('<html') || text.includes('vocab-data')) {
                                    loadedData = parseHtmlToWords(text);
                                } else {
                                    const parsed = JSON.parse(text);
                                    loadedData = parsed.map(item => ({ ...item, group: item.group || "Group 84" }));
                                }
                                if (loadedData && loadedData.length > 0) {
                                    setNotice(`成功自動載入單字檔：${path}`);
                                    break;
                                }
                            }
                        } catch (e) {}
                    }

                    const finalWords = (loadedData && Array.isArray(loadedData) && loadedData.length > 0) ? loadedData : DEFAULT_WORDS;
                    setWords(finalWords);

                    // 初始化複習組別選單（預設全選）
                    const groups = Array.from(new Set(finalWords.map(w => w.group || "Group 84")));
                    setSelectedReviewGroups(groups);

                    setIsLoading(false);
                };

                loadVocabData();
            }, []);

            // 取得所有可用組別列表
            const availableGroups = Array.from(new Set(words.map(w => w.group || "Group 84")));

            // 單字庫模式過濾後的單字列表
            const bankFilteredWords = words.filter(word => {
                const grp = word.group || "Group 84";
                if (selectedBankGroup !== 'ALL' && grp !== selectedBankGroup) return false;

                const star = starredWords[word.id] || { yellow: false, blue: false };
                if (bankStarFilter.yellow && !star.yellow) return false;
                if (bankStarFilter.blue && !star.blue) return false;

                return true;
            });

            // 鍵盤快捷鍵操控
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (mainMode === 'review_setup' || mainMode === 'review_done') return;
                    if (e.key === 'ArrowLeft') handlePrev();
                    else if (e.key === 'ArrowRight') handleNext();
                    else if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                        e.preventDefault();
                        toggleFlip();
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [mainMode, currentIndex, reviewIndex, isFlipped, words, reviewQueue]);

            const speakWord = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.9;
                    window.speechSynthesis.speak(utterance);
                }
            };

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const content = e.target.result;
                    let parsedData = null;

                    if (file.name.endsWith('.html') || file.name.endsWith('.htm') || content.includes('<html') || content.includes('vocab-data')) {
                        parsedData = parseHtmlToWords(content);
                    } else {
                        try {
                            const raw = JSON.parse(content);
                            parsedData = raw.map(item => ({ ...item, group: item.group || "Group 84" }));
                        } catch (err) {
                            setNotice("❌ 檔案內容格式錯誤，請上傳 words.html 或合法 JSON 檔案。");
                            return;
                        }
                    }

                    if (Array.isArray(parsedData) && parsedData.length > 0) {
                        setWords(parsedData);
                        setCurrentIndex(0);
                        setIsFlipped(false);
                        setStats({ red: 0, yellow: 0, green: 0, blue: 0 });
                        setCardMastery({});
                        setLastReviewedAt({});
                        const groups = Array.from(new Set(parsedData.map(w => w.group || "Group 84")));
                        setSelectedReviewGroups(groups);
                        setNotice(`✅ 成功載入「${file.name}」，共 ${parsedData.length} 個單字！`);
                    } else {
                        setNotice("❌ 檔案中未發現有效的單字資料。");
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            };

            const handleNext = () => {
                if (mainMode === 'bank') {
                    if (currentIndex < bankFilteredWords.length - 1) {
                        setIsFlipped(false);
                        setTimeout(() => setCurrentIndex(prev => prev + 1), 120);
                    }
                } else if (mainMode === 'review_active') {
                    if (reviewIndex < reviewQueue.length - 1) {
                        setIsFlipped(false);
                        setTimeout(() => setReviewIndex(prev => prev + 1), 120);
                    } else if (reviewModeType === 'endless') {
                        // 無盡循環模式：打亂重新接續
                        const reshuffled = [...reviewQueue].sort(() => Math.random() - 0.5);
                        setReviewQueue(reshuffled);
                        setIsFlipped(false);
                        setTimeout(() => setReviewIndex(0), 120);
                    }
                }
            };

            const handlePrev = () => {
                if (mainMode === 'bank') {
                    if (currentIndex > 0) {
                        setIsFlipped(false);
                        setTimeout(() => setCurrentIndex(prev => prev - 1), 120);
                    }
                } else if (mainMode === 'review_active') {
                    if (reviewIndex > 0) {
                        setIsFlipped(false);
                        setTimeout(() => setReviewIndex(prev => prev - 1), 120);
                    }
                }
            };

            const toggleFlip = () => {
                setIsFlipped(prev => !prev);
            };

            const toggleStar = (wordId, color) => {
                setStarredWords(prev => {
                    const current = prev[wordId] || { yellow: false, blue: false };
                    return {
                        ...prev,
                        [wordId]: {
                            ...current,
                            [color]: !current[color]
                        }
                    };
                });
            };

            const handleRate = (level, currentWordId) => {
                setStats(prev => ({ ...prev, [level]: prev[level] + 1 }));
                
                // 記錄此單字最新熟練度與複習時間戳記
                if (currentWordId) {
                    setCardMastery(prev => ({ ...prev, [currentWordId]: level }));
                    setLastReviewedAt(prev => ({ ...prev, [currentWordId]: Date.now() }));
                }

                if (mainMode === 'bank') {
                    handleNext();
                } else if (mainMode === 'review_active') {
                    setReviewCompletedCount(prev => prev + 1);
                    if (reviewIndex < reviewQueue.length - 1) {
                        setIsFlipped(false);
                        setTimeout(() => setReviewIndex(prev => prev + 1), 120);
                    } else {
                        if (reviewModeType === 'single') {
                            setMainMode('review_done');
                        } else {
                            // 無盡循環模式
                            const reshuffled = [...reviewQueue].sort(() => Math.random() - 0.5);
                            setReviewQueue(reshuffled);
                            setIsFlipped(false);
                            setTimeout(() => setReviewIndex(0), 120);
                        }
                    }
                }
            };

            const startReviewSession = () => {
                if (selectedReviewGroups.length === 0) {
                    setNotice("⚠️ 請至少選擇一個複習組別！");
                    return;
                }

                let pool = words.filter(word => {
                    const grp = word.group || "Group 84";
                    if (!selectedReviewGroups.includes(grp)) return false;

                    // 熟練度過濾（若有勾選任一熟練度）
                    const anyMasterySelected = Object.values(reviewMasteries).some(v => v);
                    if (anyMasterySelected) {
                        const wordMastery = cardMastery[word.id];
                        if (!wordMastery || !reviewMasteries[wordMastery]) return false;
                    }

                    // 星星過濾
                    if (reviewStars.yellow || reviewStars.blue) {
                        const starState = starredWords[word.id] || { yellow: false, blue: false };
                        if (reviewStars.yellow && !starState.yellow) return false;
                        if (reviewStars.blue && !starState.blue) return false;
                    }

                    // 天數過濾（複習 X 天內沒複習過的單字）
                    if (useDaysFilter && reviewDaysInput > 0) {
                        const lastTime = lastReviewedAt[word.id];
                        if (lastTime) {
                            const daysDiff = (Date.now() - lastTime) / (1000 * 60 * 60 * 24);
                            if (daysDiff < reviewDaysInput) {
                                return false; // 在指定天數內已經複習過，予以排除
                            }
                        }
                    }

                    return true;
                });

                if (pool.length === 0) {
                    setNotice("⚠️ 沒有符合篩選條件的單字，請調整設定後再試！");
                    return;
                }

                // 隨機打亂
                pool = [...pool].sort(() => Math.random() - 0.5);

                // 限制張數（若非無限）
                if (!isInfiniteCount && reviewCountInput > 0) {
                    pool = pool.slice(0, Number(reviewCountInput));
                }

                setReviewQueue(pool);
                setReviewIndex(0);
                setReviewCompletedCount(0);
                setIsFlipped(false);
                setMainMode('review_active');
                setNotice(null);
            };

            const resetApp = () => {
                setCurrentIndex(0);
                setReviewIndex(0);
                setIsFlipped(false);
                setStats({ red: 0, yellow: 0, green: 0, blue: 0 });
                setStarredWords({});
                setCardMastery({});
                setLastReviewedAt({});
                setNotice("已重置學習進度、歷史記錄與星號標記。");
            };

            if (isLoading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center text-white">

                                    <span className="bg-indigo-900/60 px-2 py-0.5 rounded border border-indigo-700/50">
                                        {reviewModeType === 'single' ? '🏆 單次闖關' : '♾️ 無盡循環'}
                                    </span>
                                </span>
                                <button 
                                    onClick={() => setMainMode('review_setup')}
                                    className="text-[11px] text-gray-400 hover:text-white px-2 py-0.5 rounded border border-gray-700 bg-gray-900/60 transition-colors"
                                >
                                    ⏹️ 結束複習
                                </button>
                            </div>

                            <div className="h-2 w-full bg-gray-800 rounded-full mb-2 overflow-hidden">
                                <div 
                                    className="h-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all duration-300 ease-out" 
                                    style={{ width: `${progressPercentage}%` }}
                                ></div>
                            </div>
                            
                            <div className="flex justify-between items-center text-xs text-gray-400 font-medium">
                                <span>
                                    {reviewModeType === 'single' 
                                        ? `進度 (${reviewIndex + 1} / ${reviewQueue.length})` 
                                        : `已完成 ${reviewCompletedCount} 次 (當前第 ${reviewIndex + 1} / ${reviewQueue.length} 張)`}
                                </span>
                                <div className="flex items-center gap-2 font-mono text-[11px]">
                                    <span title="陌生"><strong className="text-rose-400">🔴 {stats.red}</strong></span>
                                    <span title="生疏"><strong className="text-amber-400">🟡 {stats.yellow}</strong></span>
                                    <span title="熟練"><strong className="text-emerald-400">🟢 {stats.green}</strong></span>
                                    <span title="精通"><strong className="text-blue-400">🔵 {stats.blue}</strong></span>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ==================== 單字卡片顯示區 (庫模式 & 複習模式) ==================== */}
                    {(mainMode === 'bank' || mainMode === 'review_active') && (
                        <>
                            {(!currentWord || !currentWord.en) ? (
                                <div className="bg-[#131825] rounded-2xl p-12 border border-gray-800 text-center my-8 text-gray-400 text-xs">
                                    此篩選條件下沒有找到任何單字卡。
                                </div>
                            ) : (
                                <>
                                    {/* Flip Card Container */}
                                    <div 
                                        className="relative w-full h-96 perspective-1000 cursor-pointer mb-6 group"
                                        onClick={toggleFlip}
                                    >
                                        <div className={`w-full h-full duration-500 transform-style-3d relative transition-transform ${isFlipped ? 'rotate-y-180' : ''}`}>
                                            
                                            {/* Card Front */}
                                            <div className="absolute inset-0 w-full h-full backface-hidden bg-[#131825] rounded-2xl p-6 border border-gray-800 shadow-xl flex flex-col justify-between">
                                                {renderCardHeader()}
                                                
                                                <div className="flex flex-col items-center justify-center text-center my-auto">
                                                    <span className="text-xs text-indigo-400 font-mono mb-1.5 bg-indigo-950/60 px-2.5 py-0.5 rounded-full border border-indigo-800/50">
                                                        {currentWord.group || "Group 84"}
                                                    </span>
                                                    <h2 className="text-5xl font-extrabold text-white tracking-wide mb-3">{currentWord.en || currentWord.word}</h2>
                                                    {currentWord.pos && (
                                                        <span className="text-indigo-400 text-sm italic font-medium bg-indigo-950/40 px-3 py-1 rounded-full border border-indigo-800/50">
                                                            {currentWord.pos}
                                                        </span>
                                                    )}
                                                </div>
                                                
                                                <div className="text-center text-gray-500 text-xs flex items-center justify-center gap-1">
                                                    <span>💡 點擊卡片翻轉查看解釋</span>
                                                </div>
                                            </div>

                                            {/* Card Back */}
                                            <div className="absolute inset-0 w-full h-full backface-hidden bg-[#1a1f30] rounded-2xl p-6 border border-indigo-900/50 shadow-xl flex flex-col justify-between rotate-y-180 overflow-y-auto">
                                                <div>
                                                    {renderCardHeader()}

                                                    <div className="flex justify-between items-baseline mt-3 mb-2">
                                                        <div className="text-2xl font-bold text-white">{currentWord.en || currentWord.word}</div>
                                                        {currentWord.pos && (
                                                            <span className="text-indigo-400 text-xs italic font-mono bg-indigo-950/40 px-2.5 py-0.5 rounded-full border border-indigo-800/50">
                                                                {currentWord.pos}
                                                            </span>
                                                        )}
                                                    </div>
                                                    <div className="text-xl text-emerald-400 font-semibold mb-3 border-b border-gray-800 pb-2">
                                                        {currentWord.zh || currentWord.meaning}
                                                    </div>

                                                    {/* Example sentence */}
                                                    {renderExample(currentWord.ex)}

                                                    {/* Root and Mnemonic */}
                                                    <div className="mt-3 space-y-2 text-xs text-left">
                                                        {currentWord.root && (
                                                            <div className="bg-gray-900/60 p-2.5 rounded-lg border border-gray-800">
                                                                <span className="text-indigo-400 font-semibold">字根字源：</span>
                                                                <span className="text-gray-300">{currentWord.root}</span>
                                                            </div>
                                                        )}
                                                        {currentWord.mem && (
                                                            <div className="bg-gray-900/60 p-2.5 rounded-lg border border-gray-800">
                                                                <span className="text-indigo-400 font-semibold">記憶聯想：</span>
                                                                <span className="text-gray-300">{currentWord.mem}</span>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                                
                                                {/* 4-Color Mastery Assessment Buttons */}
                                                <div className="grid grid-cols-4 gap-1.5 mt-4 pt-2 border-t border-gray-800">
                                                    <button 
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            handleRate('red', currentWord.id);
                                                        }}
                                                        className="py-2.5 rounded-xl bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 border border-rose-800/60 text-xs font-semibold transition-colors active:scale-95 text-center"
                                                        title="沒聽過/完全不記得"
                                                    >
                                                        🔴 陌生
                                                    </button>
                                                    <button 
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            handleRate('yellow', currentWord.id);
                                                        }}
                                                        className="py-2.5 rounded-xl bg-amber-950/60 hover:bg-amber-900/80 text-amber-300 border border-amber-800/60 text-xs font-semibold transition-colors active:scale-95 text-center"
                                                        title="不太記得意思"
                                                    >
                                                        🟡 生疏
                                                    </button>
                                                    <button 
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            handleRate('green', currentWord.id);
                                                        }}
                                                        className="py-2.5 rounded-xl bg-emerald-950/60 hover:bg-emerald-900/80 text-emerald-300 border border-emerald-800/60 text-xs font-semibold transition-colors active:scale-95 text-center"
                                                        title="掌握部分字義，有些不清楚"
                                                    >
                                                        🟢 熟練
                                                    </button>
                                                    <button 
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            handleRate('blue', currentWord.id);
                                                        }}
                                                        className="py-2.5 rounded-xl bg-blue-950/60 hover:bg-blue-900/80 text-blue-300 border border-blue-800/60 text-xs font-semibold transition-colors active:scale-95 text-center"
                                                        title="完全掌握，能馬上秒答"
                                                    >
                                                        🔵 精通
                                                    </button>
                                                </div>
                                            </div>

                                        </div>
                                    </div>

                                    {/* Navigation Controls */}
                                    <div className="flex justify-between items-center gap-2 mb-4">
                                        <button 
                                            onClick={handlePrev}
                                            disabled={mainMode === 'bank' ? currentIndex === 0 : reviewIndex === 0}
                                            className={`flex-1 py-3 rounded-xl border text-xs font-medium transition-all ${
                                                (mainMode === 'bank' ? currentIndex === 0 : reviewIndex === 0) 
                                                    ? 'bg-gray-900 text-gray-600 border-gray-800 cursor-not-allowed' 
                                                    : 'bg-[#131825] text-gray-200 border-gray-700 hover:bg-gray-800 active:scale-95'
                                            }`}
                                        >
                                            ← 上一個
                                        </button>
                                        
                                        <button 
                                            onClick={toggleFlip}
                                            className="flex-1 py-3 rounded-xl border border-indigo-700/60 bg-indigo-900/40 hover:bg-indigo-900/60 text-xs font-semibold text-indigo-200 transition-all active:scale-95"
                                        >
                                            翻轉卡片 ↻
                                        </button>
                                        
                                        <button 
                                            onClick={handleNext}
                                            disabled={mainMode === 'bank' ? currentIndex === totalBankCount - 1 : (reviewModeType === 'single' && reviewIndex === reviewQueue.length - 1)}
                                            className={`flex-1 py-3 rounded-xl border text-xs font-medium transition-all ${
                                                (mainMode === 'bank' ? currentIndex === totalBankCount - 1 : (reviewModeType === 'single' && reviewIndex === reviewQueue.length - 1))
                                                    ? 'bg-gray-900 text-gray-600 border-gray-800 cursor-not-allowed' 
                                                    : 'bg-[#131825] text-gray-200 border-gray-700 hover:bg-gray-800 active:scale-95'
                                            }`}
                                        >
                                            下一個 →
                                        </button>
                                    </div>

                                    <div className="text-center text-gray-600 text-[11px]">
                                        鍵盤快捷鍵：← 上一個 | → 下一個 | 空格鍵/上下鍵 翻轉
                                    </div>
                                </>
                            )}
                        </>
                    )}

                    {/* Help Modal */}
                    {showHelpModal && (
                        <div 
                            className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4"
                            onClick={() => setShowHelpModal(false)}
                        >
                            <div 
                                className="bg-[#131825] border border-gray-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl text-left"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="flex justify-between items-center mb-3 border-b border-gray-800 pb-2">
                                    <h3 className="text-base font-bold text-white">熟練度等級說明</h3>
                                    <button 
                                        onClick={() => setShowHelpModal(false)}
                                        className="text-gray-400 hover:text-white font-bold text-sm"
                                    >
                                        ✕
                                    </button>
                                </div>
                                
                                <ul className="space-y-3 text-xs leading-relaxed">
                                    <li className="flex gap-2">
                                        <span className="text-blue-400 font-bold shrink-0">🔵 精通：</span>
                                        <span className="text-gray-300">完全掌握，一顯示英文就能馬上答出中文意思。</span>
                                    </li>
                                    <li className="flex gap-2">
                                        <span className="text-emerald-400 font-bold shrink-0">🟢 熟練：</span>
                                        <span className="text-gray-300">能掌握大部分字義，但有些延伸意思不夠熟悉。</span>
                                    </li>
                                    <li className="flex gap-2">
                                        <span className="text-amber-400 font-bold shrink-0">🟡 生疏：</span>
                                        <span className="text-gray-300">不太記得意思，需思考較久或依靠提示。</span>
                                    </li>
                                    <li className="flex gap-2">
                                        <span className="text-rose-400 font-bold shrink-0">🔴 陌生：</span>
                                        <span className="text-gray-300">沒聽過或完全不記得此單字。</span>
                                    </li>
                                </ul>

                                <button 
                                    onClick={() => setShowHelpModal(false)}
                                    className="mt-5 w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition-colors"
                                >
                                    知道了
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FlashcardApp />);
    </script>
</body>
</html>
